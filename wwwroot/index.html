<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ApiIp // Geolocalização</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --bg: #0a0e14;
    --panel: #0f1620;
    --panel-border: #1e2a38;
    --accent: #39ffe0;
    --accent-dim: #1c8f80;
    --text: #d7e3ec;
    --text-dim: #7688a0;
    --danger: #ff4d6d;
    --ok: #39ff88;
    --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(57,255,224,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(57,143,255,0.08), transparent 40%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-sans);
    padding: 2.5rem 1.5rem;
  }

  .wrap { max-width: 960px; margin: 0 auto; }

  header { margin-bottom: 2rem; }

  header .tag {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: inline-block;
    padding: 0.15rem 0.6rem;
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    margin-bottom: 0.75rem;
  }

  h1 {
    margin: 0;
    font-size: 1.9rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--accent); }

  header p { color: var(--text-dim); margin: 0.4rem 0 0; font-size: 0.95rem; }

  .panel {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0));
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 20px 40px -20px rgba(0,0,0,0.6);
  }

  #busca { display: flex; gap: 0.6rem; }

  #ip {
    flex: 1;
    background: #060a10;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }

  #ip::placeholder { color: var(--text-dim); }
  #ip:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(57,255,224,0.12); }

  button {
    background: var(--accent);
    color: #062019;
    border: none;
    border-radius: 8px;
    padding: 0 1.4rem;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }

  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: wait; }

  #erro {
    display: none;
    color: var(--danger);
    font-family: var(--font-mono);
    font-size: 0.85rem;
    margin-top: 0.9rem;
    padding-top: 0.9rem;
    border-top: 1px dashed var(--panel-border);
  }
  #erro.show { display: block; }

  #resultado { display: none; }
  #resultado.show { display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.9rem; }

  .stat { display: flex; flex-direction: column; gap: 0.2rem; }
  .stat .label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  .stat .value { font-size: 1rem; font-weight: 600; }

  .badges { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.1rem; }

  .badge {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
  }
  .badge.on { color: var(--danger); border-color: rgba(255,77,109,0.4); background: rgba(255,77,109,0.08); }
  .badge.off { color: var(--ok); border-color: rgba(57,255,136,0.35); background: rgba(57,255,136,0.06); }

  #map {
    height: 460px;
    width: 100%;
    border-radius: 14px;
    border: 1px solid var(--panel-border);
    filter: saturate(0.9);
  }

  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel);
    color: var(--text);
    font-family: var(--font-mono);
  }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 0.75rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="tag">ApiIp &middot; geolocalização</span>
      <h1>Localização por <span>IP</span></h1>
      <p>Consulta em tempo real via ipquery.io — provedor, coordenadas e sinais de risco.</p>
    </header>

    <div class="panel">
      <div id="busca">
        <input id="ip" type="text" placeholder="ex: 8.8.8.8" autocomplete="off" />
        <button id="btn-buscar">Buscar</button>
      </div>

      <div id="erro"></div>

      <div id="resultado">
        <div class="grid">
          <div class="stat"><span class="label">Cidade</span><span class="value" id="v-cidade">—</span></div>
          <div class="stat"><span class="label">Estado</span><span class="value" id="v-estado">—</span></div>
          <div class="stat"><span class="label">País</span><span class="value" id="v-pais">—</span></div>
          <div class="stat"><span class="label">Provedor</span><span class="value" id="v-provedor">—</span></div>
          <div class="stat"><span class="label">Risk score</span><span class="value" id="v-risk">—</span></div>
        </div>
        <div class="badges" id="badges"></div>
      </div>
    </div>

    <div id="map"></div>

    <footer>ApiIp — dados de geolocalização via ipquery.io</footer>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map("map", { zoomControl: true }).setView([20, 0], 2);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO",
      maxZoom: 19,
      subdomains: "abcd",
    }).addTo(map);

    let marker;
    const btn = document.getElementById("btn-buscar");
    const ipInput = document.getElementById("ip");
    const erroEl = document.getElementById("erro");
    const resultadoEl = document.getElementById("resultado");

    function badge(label, ativo) {
      const span = document.createElement("span");
      span.className = "badge " + (ativo ? "on" : "off");
      span.textContent = (ativo ? "● " : "○ ") + label;
      return span;
    }

    async function buscarIp() {
      const ip = ipInput.value.trim();
      erroEl.classList.remove("show");
      resultadoEl.classList.remove("show");

      if (!ip) {
        erroEl.textContent = "Digite um IP.";
        erroEl.classList.add("show");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Buscando…";

      try {
        const resp = await fetch(`/v1/Ip/${encodeURIComponent(ip)}`);
        const dados = await resp.json();

        if (!resp.ok) {
          erroEl.textContent = dados.mensagem || `Erro ao consultar o IP (HTTP ${resp.status}).`;
          erroEl.classList.add("show");
          return;
        }

        const posicao = [dados.latitude, dados.longitude];
        map.setView(posicao, 12);
        if (marker) marker.remove();
        marker = L.marker(posicao).addTo(map).bindPopup(ip).openPopup();

        document.getElementById("v-cidade").textContent = dados.cidade || "—";
        document.getElementById("v-estado").textContent = dados.estado || "—";
        document.getElementById("v-pais").textContent = dados.siglaPais ? `${dados.pais} (${dados.siglaPais})` : (dados.pais || "—");
        document.getElementById("v-provedor").textContent = dados.provedor || "—";
        document.getElementById("v-risk").textContent = dados.riskScore ?? "—";

        const badgesEl = document.getElementById("badges");
        badgesEl.innerHTML = "";
        badgesEl.append(
          badge("Mobile", dados.mobile),
          badge("VPN", dados.vpn),
          badge("Tor", dados.tor),
          badge("Proxy", dados.proxy),
          badge("Datacenter", dados.datacenter),
        );

        resultadoEl.classList.add("show");
      } catch (err) {
        erroEl.textContent = "Falha ao consultar a API.";
        erroEl.classList.add("show");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Buscar";
      }
    }

    btn.addEventListener("click", buscarIp);
    ipInput.addEventListener("keydown", (e) => { if (e.key === "Enter") buscarIp(); });
  </script>
</body>
</html>
